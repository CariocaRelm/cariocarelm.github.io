<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CariocaRelm — Indie Game Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --black: #080808;
            --white: #f2f0eb;
            --accent: #ff3b2f;
            --muted: #555;
        }

        html,
        body {
            height: 100%;
        }

        body {
            background: var(--black);
            color: var(--white);
            font-family: 'DM Sans', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 32px 24px;
            overflow: hidden;
            position: relative;
        }

        /* grain overlay */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
            opacity: 0.04;
            pointer-events: none;
            z-index: 0;
        }

        /* big background text */
        .bg-text {
            position: fixed;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(80px, 20vw, 220px);
            color: rgba(255, 255, 255, 0.025);
            white-space: nowrap;
            pointer-events: none;
            z-index: 0;
            letter-spacing: 0.05em;
            user-select: none;
        }

        .content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 32px;
            text-align: center;
            max-width: 560px;
            width: 100%;
        }

        /* logo */
        .logo-wrap {
            width: clamp(140px, 36vw, 220px);
            aspect-ratio: 1;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 8px rgba(255, 59, 47, 0.06), 0 32px 64px rgba(0, 0, 0, 0.6);
            opacity: 0;
            animation: fadeUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.1s forwards;
        }

        .logo-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* headings */
        .studio-name {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(42px, 12vw, 80px);
            letter-spacing: 0.06em;
            line-height: 0.9;
            opacity: 0;
            animation: fadeUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.25s forwards;
        }

        .studio-name span {
            color: var(--accent);
        }

        .tagline {
            font-size: 13px;
            font-weight: 500;
            color: var(--muted);
            letter-spacing: 0.18em;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.4s forwards;
        }

        /* divider */
        .divider {
            width: 40px;
            height: 2px;
            background: var(--accent);
            opacity: 0;
            animation: fadeUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.5s forwards;
        }

        /* status pill */
        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 100px;
            padding: 10px 20px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
            opacity: 0;
            animation: fadeUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.6s forwards;
        }

        .status .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #f0a500;
            box-shadow: 0 0 8px #f0a500;
            animation: blink 2s ease-in-out infinite;
            flex-shrink: 0;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }
        }

        /* footer links */
        .footer-links {
            display: flex;
            gap: 24px;
            opacity: 0;
            animation: fadeUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.75s forwards;
        }

        .footer-links a {
            font-size: 12px;
            color: var(--muted);
            text-decoration: none;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            transition: color 0.2s;
        }

        .footer-links a:hover {
            color: var(--white);
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(18px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 400px) {
            .footer-links {
                flex-direction: column;
                align-items: center;
                gap: 14px;
            }
        }
    </style>
</head>

<body>

    <div class="bg-text">CARIOCA</div>

    <div class="content">

        <div class="logo-wrap">
            <img src="public/images/logo-carioca.jpg" alt="CariocaRelm logo" />
        </div>

        <div>
            <h1 class="studio-name">Carioca<span>Realm</span></h1>
        </div>

        <p class="tagline">Indie Game Studio · Brazil</p>

        <div class="divider"></div>

        <div class="status">
            <span class="dot"></span>
            First game dropping soon — stay tuned
        </div>

        <nav class="footer-links">
            <a href="mailto:cariocahelm@gmail.com">Contact</a>
            <a href="/privacy-policy/">Privacy Policy</a>
        </nav>

    </div>

</body>

</html>
